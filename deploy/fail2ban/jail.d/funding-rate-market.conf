# fail2ban jail for the Funding Rate Market auth log.
#
# Install to /etc/fail2ban/jail.d/funding-rate-market.conf, then:
#
#   sudo fail2ban-client reload
#   sudo fail2ban-client status funding-rate-market
#
# `logpath` must match AUTH_LOG_PATH in .env.local, as an absolute path. fail2ban
# runs as root and does not know the app's working directory, so a relative path
# silently watches nothing.

[funding-rate-market]

enabled  = true
filter   = funding-rate-market
logpath  = /srv/funding-rate-market/data/auth.log

# The app has one password and no user list, so there is no legitimate reason to
# get it wrong five times in ten minutes. These are deliberately tighter than the
# sshd defaults for that reason.
maxretry = 5
findtime = 10m
bantime  = 1h

# Each repeat offence bans for longer: 1h, 2h, 4h… up to a week. A scanner that
# comes back is not going to be discouraged by another hour.
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 1w

# Ban the app's port rather than everything. If the app sits behind nginx on 443,
# change this to `port = http,https` — banning 3000 achieves nothing when nothing
# reaches 3000 directly.
port     = 3000
protocol = tcp
action   = %(action_)s

# Your own addresses, so a fat-fingered password on the machine you administer from
# does not lock you out of it. Always includes loopback.
ignoreip = 127.0.0.1/8 ::1
