# fail2ban filter for the Funding Rate Market auth log.
#
# Install to /etc/fail2ban/filter.d/funding-rate-market.conf
#
# The app writes one line per sign-in attempt to the file named by AUTH_LOG_PATH:
#
#   2026-08-21T09:14:03.114Z auth: failed password for frs from 203.0.113.9
#   2026-08-21T09:14:07.902Z auth: rate-limited attempt for frs from 203.0.113.9
#   2026-08-21T09:15:11.440Z auth: accepted password for frs from 203.0.113.9
#
# Only the first counts towards a ban. The second means the app's own throttle
# already refused the request, so counting it would punish an address twice for one
# burst — and a client that keeps hitting a closed door is doing less damage than
# one still guessing. Change `failregex` if you disagree; the line is there for it.

[Definition]

# <HOST> is fail2ban's own IP capture. Anchored at the start so the timestamp
# cannot be spoofed into position by a log line from elsewhere.
failregex = ^\s*\S+ auth: failed password for \S+ from <HOST>\s*$

# Successful and rate-limited attempts are explicitly not failures.
ignoreregex = ^\s*\S+ auth: (accepted password|rate-limited attempt) for \S+ from \S+\s*$

# The timestamps are ISO 8601 with milliseconds and a Z suffix, which fail2ban's
# built-in patterns do not match — without this every line is read as "now" and the
# findtime window stops meaning anything.
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S.%%f
